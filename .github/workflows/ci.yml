name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        name: Check, build, and test
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check, build, and test
              run: xvfb-run -a npm test
